server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  config:
    import: classpath:ticketrush-observability.yml,optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:booking_db}
    username: ${DB_USER:booking_svc}
    password: ${DB_PASSWORD:${BOOKING_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
    web:
      pageable:
        max-page-size: 50
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    listener:
      # One consumer thread per partition (topics have 12, see MessagingConfig).
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:12}


ticketrush:
  booking:
    hold-duration: PT10M
    hold-grace: PT60S
    expiry-sweep-interval-ms: 5000
    admission-token-key: ${ADMISSION_TOKEN_KEY:}
  outbox:
    relay:
      interval-ms: 200
