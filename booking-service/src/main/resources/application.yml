server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:booking_db}
    username: ${DB_USER:booking_svc}
    password: ${DB_PASSWORD:booking_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ticketrush:
  booking:
    hold-duration: PT10M
    hold-grace: PT60S
  outbox:
    relay:
      interval-ms: 200
