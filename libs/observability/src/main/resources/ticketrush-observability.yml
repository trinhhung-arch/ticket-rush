# Observability defaults imported by every service (spring.config.import).
# Export is off unless OTEL_EXPORT_ENABLED=true, so tests and IDE runs without a collector stay quiet;
# docker-compose.yml turns it on and points OTEL_EXPORTER_OTLP_ENDPOINT at the collector.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  observations:
    enable:
      # The outbox relay runs every 200 ms; tracing each run would bury the real traces.
      tasks.scheduled: false
  tracing:
    sampling:
      # 100 % for development; lower it for load tests (TRACING_SAMPLING_PROBABILITY=0.01).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  # Metrics are scraped by Prometheus from /actuator/prometheus, not pushed.
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs

spring:
  kafka:
    # Carry the W3C traceparent header through Kafka, so one trace spans producer and consumer.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
