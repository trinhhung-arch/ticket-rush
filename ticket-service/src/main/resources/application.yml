server:
  port: ${PORT:8084}
  shutdown: graceful

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: ticket-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:ticket_db}
    username: ${DB_USER:ticket_svc}
    password: ${DB_PASSWORD:${TICKET_DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ticketrush:
  ticket:
    # Required, no default: the service refuses to start without a key (NFR-SEC-03).
    signing-key: ${TICKET_SIGNING_KEY}
  outbox:
    relay:
      interval-ms: 200
