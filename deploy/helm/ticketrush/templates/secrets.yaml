{{- /*
NFR-SEC-03: random on first install, the same values on every upgrade (lookup), never in Git.
Changing a database password after Postgres initialised its volume would lock the services out.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "ticketrush.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $keys := list "POSTGRES_PASSWORD" "EVENT_DB_PASSWORD" "BOOKING_DB_PASSWORD" "PAYMENT_DB_PASSWORD" "TICKET_DB_PASSWORD" "NOTIFY_DB_PASSWORD" "REDIS_PASSWORD" "TICKET_SIGNING_KEY" "ADMISSION_TOKEN_KEY" "PAYMENT_WEBHOOK_SECRET" "KEYCLOAK_ADMIN_PASSWORD" "KEYCLOAK_DB_PASSWORD" "DEMO_USER_PASSWORD" "KAFKA_ADMIN_PASSWORD" "KAFKA_EVENT_SERVICE_PASSWORD" "KAFKA_BOOKING_SERVICE_PASSWORD" "KAFKA_PAYMENT_SERVICE_PASSWORD" "KAFKA_TICKET_SERVICE_PASSWORD" "KAFKA_NOTIFICATION_SERVICE_PASSWORD" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ticketrush.labels" (dict "name" "secrets" "root" .) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $keys }}
  {{ . }}: {{ index $existing . | default (randAlphaNum 40 | b64enc) }}
  {{- end }}
{{- end }}
