{{- if .Values.infrastructure.enabled }}
{{- $ctx := dict "name" "keycloak" "root" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "ticketrush.labels" $ctx | nindent 4 }}
data:
  # The same realm docker compose imports; demo passwords come from the Secret (FR-IAM-01).
  ticketrush-realm.json: |
    {{- .Files.Get "files/ticketrush-realm.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "ticketrush.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ticketrush.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticketrush.selector" $ctx | nindent 8 }}
    spec:
      # The image's user 1000 owns /opt/keycloak, which every user can read, so the root group is not needed.
      {{- include "ticketrush.podSecurity" (dict "uid" 1000 "gid" 1000) | nindent 6 }}
      # The read-only root filesystem keeps start from re-augmenting the server into lib/quarkus, so that
      # directory is an emptyDir seeded with the image's own build output first.
      initContainers:
        - name: seed-build
          image: {{ .Values.infrastructure.keycloak.image }}
          command: ["cp", "-R", "/opt/keycloak/lib/quarkus/.", "/build/"]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 64Mi }
          {{- include "ticketrush.containerSecurity" (dict "readOnlyRootFilesystem" true) | nindent 10 }}
          volumeMounts:
            - { name: build, mountPath: /build }
      containers:
        - name: keycloak
          image: {{ .Values.infrastructure.keycloak.image }}
          # Production mode (INF-05), not start-dev: a real database, a fixed hostname, strict checks.
          args: ["start", "--import-realm"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak_db" }
            - { name: KC_DB_USERNAME, value: keycloak_svc }
            {{- include "ticketrush.secretEnv" (dict "env" "KC_DB_PASSWORD" "key" "KEYCLOAK_DB_PASSWORD" "root" .) | nindent 12 }}
            # Issuer = the address browsers use; services reach it as http://keycloak:8080.
            - { name: KC_HOSTNAME, value: {{ .Values.publicUrls.keycloak | quote }} }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            # Plain HTTP because the local cluster has no TLS; in production TLS ends at the ingress or
            # load balancer in front of it (and KC_PROXY_HEADERS is set).
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            # No admin console on the public port; the realm comes from the imported file, and the admin
            # REST API (kcadm.sh) still works with the admin's credentials.
            - { name: KC_FEATURES_DISABLED, value: admin }
            {{- include "ticketrush.secretEnv" (dict "env" "KC_BOOTSTRAP_ADMIN_PASSWORD" "key" "KEYCLOAK_ADMIN_PASSWORD" "root" .) | nindent 12 }}
            {{- include "ticketrush.secretEnv" (dict "env" "DEMO_USER_PASSWORD" "key" "DEMO_USER_PASSWORD" "root" .) | nindent 12 }}
          {{- include "ticketrush.containerSecurity" (dict "readOnlyRootFilesystem" true) | nindent 10 }}
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            # start re-augments the server for this configuration into lib/quarkus (seeded above), and
            # keeps temporary files under data.
            - { name: build, mountPath: /opt/keycloak/lib/quarkus }
            - { name: data, mountPath: /opt/keycloak/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: build
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "ticketrush.labels" $ctx | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "ticketrush.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: {{ .Values.infrastructure.keycloak.nodePort }} }
{{- end }}
