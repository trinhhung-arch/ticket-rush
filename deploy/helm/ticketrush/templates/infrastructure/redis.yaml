{{- if .Values.infrastructure.enabled }}
{{- $ctx := dict "name" "redis" "root" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "ticketrush.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ticketrush.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticketrush.selector" $ctx | nindent 8 }}
    spec:
      # The image's redis user (999, group 1000), which owns /data.
      {{- include "ticketrush.podSecurity" (dict "uid" 999 "gid" 1000) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.infrastructure.redis.image }}
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ticketrush.secretName" $ctx.root }}
                  key: REDIS_PASSWORD
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
          {{- include "ticketrush.containerSecurity" dict | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "ticketrush.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "ticketrush.selector" $ctx | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
