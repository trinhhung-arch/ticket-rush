{{- if .Values.infrastructure.enabled }}
{{- $ctx := dict "name" "kafka" "root" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "ticketrush.labels" $ctx | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "ticketrush.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticketrush.selector" $ctx | nindent 8 }}
    spec:
      {{- include "ticketrush.podSecurity" (dict "uid" 1000 "gid" 1000) | nindent 6 }}
      containers:
        - name: kafka
          image: {{ .Values.infrastructure.kafka.image }}
          ports:
            - { name: kafka, containerPort: 9092 }
          env:
            # One KRaft node, broker and controller, advertised under its Service name.
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            # Every listener asks for a username and password (INF-04); ACLs come from kafka-init.
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_SASL_ENABLED_MECHANISMS, value: PLAIN }
            - { name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL, value: PLAIN }
            - { name: KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL, value: PLAIN }
            - { name: KAFKA_AUTHORIZER_CLASS_NAME, value: org.apache.kafka.metadata.authorizer.StandardAuthorizer }
            - { name: KAFKA_SUPER_USERS, value: "User:admin" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            # The accounts' passwords, without the KAFKA_ prefix that would turn them into broker settings.
            {{- range list "ADMIN" "EVENT_SERVICE" "BOOKING_SERVICE" "PAYMENT_SERVICE" "TICKET_SERVICE" "NOTIFICATION_SERVICE" }}
            {{- include "ticketrush.secretEnv" (dict "env" (printf "SASL_%s_PASSWORD" .) "key" (printf "KAFKA_%s_PASSWORD" .) "root" $) | nindent 12 }}
            {{- end }}
            - name: KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG
              value: >-
                org.apache.kafka.common.security.plain.PlainLoginModule required
                username="admin" password="$(SASL_ADMIN_PASSWORD)"
                user_admin="$(SASL_ADMIN_PASSWORD)"
                user_event-service="$(SASL_EVENT_SERVICE_PASSWORD)"
                user_booking-service="$(SASL_BOOKING_SERVICE_PASSWORD)"
                user_payment-service="$(SASL_PAYMENT_SERVICE_PASSWORD)"
                user_ticket-service="$(SASL_TICKET_SERVICE_PASSWORD)"
                user_notification-service="$(SASL_NOTIFICATION_SERVICE_PASSWORD)";
            - name: KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG
              value: >-
                org.apache.kafka.common.security.plain.PlainLoginModule required
                username="admin" password="$(SASL_ADMIN_PASSWORD)" user_admin="$(SASL_ADMIN_PASSWORD)";
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 768Mi }
          {{- include "ticketrush.containerSecurity" dict | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.infrastructure.kafka.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "ticketrush.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "ticketrush.selector" $ctx | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
# Topics and per-service ACLs (INF-03, INF-04): infra/kafka/init-kafka.sh, as in docker compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-init
  labels:
    {{- include "ticketrush.labels" (dict "name" "kafka-init" "root" .) | nindent 4 }}
data:
  init-kafka.sh: |
    {{- .Files.Get "files/init-kafka.sh" | nindent 4 }}
---
# A new Job per release revision: the script is safe to run again, and a Job's spec cannot change.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-{{ .Release.Revision }}
  labels:
    {{- include "ticketrush.labels" (dict "name" "kafka-init" "root" .) | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "ticketrush.selector" (dict "name" "kafka-init" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "ticketrush.podSecurity" (dict "uid" 1000 "gid" 1000) | nindent 6 }}
      containers:
        - name: kafka-init
          image: {{ .Values.infrastructure.kafka.image }}
          command: ["bash", "/scripts/init-kafka.sh"]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            {{- include "ticketrush.secretEnv" (dict "env" "KAFKA_ADMIN_PASSWORD" "key" "KAFKA_ADMIN_PASSWORD" "root" .) | nindent 12 }}
          {{- include "ticketrush.containerSecurity" dict | nindent 10 }}
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: scripts
          configMap:
            name: kafka-init
{{- end }}
