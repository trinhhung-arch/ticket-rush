# Images built from this repository. deploy/kind/up.sh builds them locally and loads them into kind;
# CI publishes them as ghcr.io/<owner>/ticket-rush/<module>:<git sha> (set prefix and tag to use those).
images:
  prefix: ticket-rush-
  tag: latest
  pullPolicy: IfNotPresent

# Where browsers and scripts reach the cluster. Tokens carry publicUrls.keycloak as their issuer.
publicUrls:
  gateway: http://localhost:28080
  keycloak: http://localhost:28180

# Every Java service: two instances, probes, a disruption budget and a graceful stop (NFR-AVAIL-04, 06).
service:
  replicas: 2
  # Defaults; a service may override them under services.<name>.resources.
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 640Mi }
  # Heap at 60 % of the limit leaves room for metaspace, thread stacks and Netty buffers.
  javaOptions: "-XX:MaxRAMPercentage=60"
  # Spring finishes in-flight requests for up to 30 s; the pod gets 40 s before it is killed.
  terminationGracePeriodSeconds: 40
  # Time for the endpoint to leave every Service before the app stops accepting connections.
  preStopSleepSeconds: 5
  env:
    OTEL_EXPORT_ENABLED: "false"
    # 2 instances x 6 listener threads = the 12 partitions of each topic.
    KAFKA_LISTENER_CONCURRENCY: "6"

services:
  api-gateway:
    port: 8080
    nodePort: 30080
    env:
      EVENT_SERVICE_URI: http://event-service:8081
      BOOKING_SERVICE_URI: http://booking-service:8082
      PAYMENT_SERVICE_URI: http://payment-service:8083
      TICKET_SERVICE_URI: http://ticket-service:8084
      WAITING_ROOM_SERVICE_URI: http://waiting-room-service:8086
      REDIS_HOST: redis
      REDIS_PORT: "6379"
  event-service:
    port: 8081
    env:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    secretEnv:
      DB_PASSWORD: EVENT_DB_PASSWORD
  booking-service:
    port: 8082
    # JPA, Redis, the saga's Kafka listeners and the hold API: OOM-killed at 512Mi.
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 768Mi }
    env:
      DB_HOST: postgres
      DB_PORT: "5432"
      # Pools of every instance together (60 + 40 + 24 + 24 + 20) stay under Postgres' 200.
      DB_POOL_SIZE: "30"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    secretEnv:
      DB_PASSWORD: BOOKING_DB_PASSWORD
      ADMISSION_TOKEN_KEY: ADMISSION_TOKEN_KEY
  payment-service:
    port: 8083
    env:
      DB_POOL_SIZE: "20"
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    publicBaseUrlEnv: PUBLIC_BASE_URL
    secretEnv:
      DB_PASSWORD: PAYMENT_DB_PASSWORD
      PAYMENT_WEBHOOK_SECRET: PAYMENT_WEBHOOK_SECRET
  ticket-service:
    port: 8084
    env:
      DB_POOL_SIZE: "12"
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    secretEnv:
      DB_PASSWORD: TICKET_DB_PASSWORD
      TICKET_SIGNING_KEY: TICKET_SIGNING_KEY
  notification-service:
    port: 8085
    env:
      DB_POOL_SIZE: "12"
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    secretEnv:
      DB_PASSWORD: NOTIFY_DB_PASSWORD
  waiting-room-service:
    port: 8086
    env:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WAITING_ROOM_CAPACITY: "2000"
    secretEnv:
      ADMISSION_TOKEN_KEY: ADMISSION_TOKEN_KEY

# Single-instance infrastructure for a local cluster. In production these would be managed services
# (RDS, ElastiCache, MSK, a Keycloak cluster) and this section switched off.
infrastructure:
  enabled: true
  postgres:
    image: postgres:17-alpine
    storage: 2Gi
  redis:
    image: redis:8-alpine
  kafka:
    image: apache/kafka:4.1.0
    storage: 2Gi
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    nodePort: 30180
  mailpit:
    image: axllent/mailpit:v1.31.3
    nodePort: 30825

# Passwords and keys. Left empty, random values are generated on install and kept on upgrade
# (NFR-SEC-03); nothing secret is written in this file.
secrets:
  existingSecret: ""
