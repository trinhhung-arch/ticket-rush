global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ticketrush
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - event-service:8081
          - booking-service:8082
          - payment-service:8083
          - ticket-service:8084
          - notification-service:8085
          - waiting-room-service:8086
