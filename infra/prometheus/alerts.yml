# NFR-OBS-04. Firing alerts are listed at http://localhost:9090/alerts.
groups:
  - name: ticketrush
    rules:
      - alert: OutboxLagHigh
        expr: max by (application) (ticketrush_outbox_lag_seconds) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Outbox của {{ $labels.application }} chậm hơn 10 giây: Kafka hoặc relay đang kẹt"
      - alert: KafkaConsumerLagHigh
        expr: max by (application) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} đang tụt lại hơn 1.000 message"
      - alert: HighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hơn 1% request của {{ $labels.application }} lỗi 5xx"
      - alert: SagaConfirmationSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(ticketrush_saga_confirmation_seconds_bucket[5m]))) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 từ lúc trả tiền tới CONFIRMED vượt 3 giây (NFR-PERF-04)"
