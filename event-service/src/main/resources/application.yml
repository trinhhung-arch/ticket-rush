server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: event-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:event_db}
    username: ${DB_USER:event_svc}
    password: ${DB_PASSWORD:event_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
  data:
    web:
      pageable:
        max-page-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ticketrush:
  outbox:
    relay:
      interval-ms: 200
