# Whole system on one machine: ./scripts/init-dev-env.sh once, then docker compose up --build
# Credentials come from the generated, git-ignored .env; none are written here (NFR-SEC-03).
# "required variable ... is missing a value" means .env is missing: run ./scripts/init-dev-env.sh.
# Only the gateway is published for API traffic (FR-GW-01). Infrastructure ports are published on
# non-default host ports (Postgres 15432, Redis 16379, Kafka 9094) for debugging and for running a
# service from the IDE against this stack without clashing with other local databases.
name: ticket-rush

x-service: &service
  restart: unless-stopped

# Every Java service ships traces and logs to the collector (NFR-OBS-01, 03).
x-otel: &otel
  OTEL_EXPORT_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:?}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD:?}
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:?}
    ports: ["15432:5432"]
    volumes:
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: ticket-rush
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  api-gateway:
    <<: *service
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    environment:
      <<: *otel
      EVENT_SERVICE_URI: http://event-service:8081
      BOOKING_SERVICE_URI: http://booking-service:8082
      PAYMENT_SERVICE_URI: http://payment-service:8083
      TICKET_SERVICE_URI: http://ticket-service:8084
      WAITING_ROOM_SERVICE_URI: http://waiting-room-service:8086
    depends_on: [event-service, booking-service, payment-service, ticket-service, waiting-room-service]

  event-service:
    <<: *service
    build: { context: ., args: { MODULE: event-service } }
    environment:
      <<: *otel
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${EVENT_DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  booking-service:
    <<: *service
    build: { context: ., args: { MODULE: booking-service } }
    environment:
      <<: *otel
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  payment-service:
    <<: *service
    build: { context: ., args: { MODULE: payment-service } }
    environment:
      <<: *otel
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Checkout links handed to customers point at the public gateway.
      PUBLIC_BASE_URL: http://localhost:${GATEWAY_PORT:-8080}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  ticket-service:
    <<: *service
    build: { context: ., args: { MODULE: ticket-service } }
    environment:
      <<: *otel
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${TICKET_DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TICKET_SIGNING_KEY: ${TICKET_SIGNING_KEY:?}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification-service:
    <<: *service
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      <<: *otel
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${NOTIFY_DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }

  # Phase 4 service: running skeleton for now.
  waiting-room-service:
    <<: *service
    build: { context: ., args: { MODULE: waiting-room-service } }
    environment: *otel

  # --- Observability (phase 3) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4318:4318"]
    depends_on: [jaeger, loki]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  loki:
    image: grafana/loki:3.7.0

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Local demo only: open without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticketrush-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, jaeger]

volumes:
  postgres-data:
