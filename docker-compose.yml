# Whole system on one machine: ./scripts/init-dev-env.sh once, then docker compose up --build
# Credentials come from the generated, git-ignored .env; none are written here (NFR-SEC-03).
# "required variable ... is missing a value" means .env is missing: run ./scripts/init-dev-env.sh.
# Only the gateway is published for API traffic (FR-GW-01). Infrastructure ports are published on
# non-default host ports (Postgres 15432, Redis 16379, Kafka 9094 with SASL) for debugging and for running a
# service from the IDE against this stack without clashing with other local databases.
name: ticket-rush

x-service: &service
  restart: unless-stopped
  # Spring gets 30 s to finish in-flight requests after SIGTERM (NFR-AVAIL-06); Docker waits a bit longer.
  stop_grace_period: 35s

# Every Java service ships traces and logs to the collector (NFR-OBS-01, 03).
x-otel: &otel
  OTEL_EXPORT_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

# Kafka accounts (INF-03, INF-04): the broker's user list, one account per service. ACLs that
# infra/kafka/init-kafka.sh sets limit each account to the topics that service writes or reads.
x-kafka-users: &kafka-users >-
  org.apache.kafka.common.security.plain.PlainLoginModule required
  username="admin" password="${KAFKA_ADMIN_PASSWORD:?}"
  user_admin="${KAFKA_ADMIN_PASSWORD:?}"
  user_event-service="${KAFKA_EVENT_SERVICE_PASSWORD:?}"
  user_booking-service="${KAFKA_BOOKING_SERVICE_PASSWORD:?}"
  user_payment-service="${KAFKA_PAYMENT_SERVICE_PASSWORD:?}"
  user_ticket-service="${KAFKA_TICKET_SERVICE_PASSWORD:?}"
  user_notification-service="${KAFKA_NOTIFICATION_SERVICE_PASSWORD:?}"
  user_kafka-ui="${KAFKA_UI_PASSWORD:?}";

# Tokens carry the public issuer; the signing keys are fetched from Keycloak inside the network (FR-IAM-01).
x-jwt: &jwt
  JWT_ISSUER: http://localhost:8180/realms/ticketrush
  JWT_JWK_SET_URI: http://keycloak:8080/realms/ticketrush/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:17.11-alpine3.24
    # Five services with their own pools: 50 + 30 + 20 + 20 + 10 connections at most.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:?}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD:?}
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:?}
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.3-alpine
    # NFR-SEC: require a password so seat holds, rate-limit buckets and the queue are not open to anyone
    # who can reach the port. The port is also bound to 127.0.0.1 above.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    ports: ["127.0.0.1:9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Every listener asks for a username and password; nothing reads or writes anonymously.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: *kafka-users
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *kafka-users
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:?}" user_admin="${KAFKA_ADMIN_PASSWORD:?}";
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      # Topics exist only because kafka-init created them; a client cannot conjure one up.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # The port answers once the broker is up; kafka-init then signs in and waits for it properly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9092"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Topics and per-service ACLs (infra/kafka/init-kafka.sh); every Kafka client waits for it.
  kafka-init:
    image: apache/kafka:4.2.2
    entrypoint: ["bash", "/init-kafka.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
    volumes:
      - ./infra/kafka/init-kafka.sh:/init-kafka.sh:ro
    depends_on:
      kafka: { condition: service_healthy }

  # Identity provider (FR-IAM-01). Tokens carry the issuer http://localhost:8180/realms/ticketrush
  # wherever they were requested; services inside the network fetch signing keys over the back channel.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Demo accounts in the realm file take their password from here, not from Git.
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?}
    volumes:
      - ./infra/keycloak/ticketrush-realm.json:/opt/keycloak/data/import/ticketrush-realm.json:ro
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      # The image has no curl; ask the management port with bash alone.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports: ["127.0.0.1:8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: ticket-rush
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # A read-only Kafka account (see init-kafka.sh) behind the UI's own login: user admin.
      KAFKA_CLUSTERS_0_READONLY: "true"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="kafka-ui" password="${KAFKA_UI_PASSWORD:?}";
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_LOGIN_PASSWORD:?}
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  api-gateway:
    <<: *service
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    environment:
      <<: [*otel, *jwt]
      EVENT_SERVICE_URI: http://event-service:8081
      BOOKING_SERVICE_URI: http://booking-service:8082
      PAYMENT_SERVICE_URI: http://payment-service:8083
      TICKET_SERVICE_URI: http://ticket-service:8084
      WAITING_ROOM_SERVICE_URI: http://waiting-room-service:8086
      # Actuator (and /actuator/prometheus) on an internal-only port; the published 8080 serves only /api.
      MANAGEMENT_PORT: "8090"
      # Rate-limit buckets (FR-GW-02) are shared by every gateway instance through Redis.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      event-service: { condition: service_started }
      booking-service: { condition: service_started }
      payment-service: { condition: service_started }
      ticket-service: { condition: service_started }
      waiting-room-service: { condition: service_started }

  event-service:
    <<: *service
    build: { context: ., args: { MODULE: event-service } }
    environment:
      <<: [*otel, *jwt]
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${EVENT_DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Signs in to Kafka as itself (user = the service name); see init-kafka.sh.
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_PASSWORD: ${KAFKA_EVENT_SERVICE_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  booking-service:
    <<: *service
    build: { context: ., args: { MODULE: booking-service } }
    environment:
      <<: [*otel, *jwt]
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:?}
      # HTTP traffic and the saga's Kafka listeners share this pool; 20 starved the saga at 1,000 req/s.
      DB_POOL_SIZE: 50
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Signs in to Kafka as itself (user = the service name); see init-kafka.sh.
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_PASSWORD: ${KAFKA_BOOKING_SERVICE_PASSWORD:?}
      ADMISSION_TOKEN_KEY: ${ADMISSION_TOKEN_KEY:?}
      # The saga verifies PaymentSucceeded events against payment-service before confirming (NFR-SEC-01).
      PAYMENT_SERVICE_URI: http://payment-service:8083
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  payment-service:
    <<: *service
    build: { context: ., args: { MODULE: payment-service } }
    environment:
      <<: [*otel, *jwt]
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      # 12 listener threads plus checkouts: 10 left 184 requests waiting when Kafka came back.
      DB_POOL_SIZE: 30
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Signs in to Kafka as itself (user = the service name); see init-kafka.sh.
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_PASSWORD: ${KAFKA_PAYMENT_SERVICE_PASSWORD:?}
      # Checkout links handed to customers point at the public gateway.
      PUBLIC_BASE_URL: http://localhost:${GATEWAY_PORT:-8080}
      # Shared with the (mock) payment provider, which signs every webhook with it (FR-PAY-04).
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  ticket-service:
    <<: *service
    build: { context: ., args: { MODULE: ticket-service } }
    environment:
      <<: [*otel, *jwt]
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${TICKET_DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Signs in to Kafka as itself (user = the service name); see init-kafka.sh.
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_PASSWORD: ${KAFKA_TICKET_SERVICE_PASSWORD:?}
      TICKET_SIGNING_KEY: ${TICKET_SIGNING_KEY:?}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  notification-service:
    <<: *service
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      <<: [*otel, *jwt]
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${NOTIFY_DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Signs in to Kafka as itself (user = the service name); see init-kafka.sh.
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_PASSWORD: ${KAFKA_NOTIFICATION_SERVICE_PASSWORD:?}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

  waiting-room-service:
    <<: *service
    build: { context: ., args: { MODULE: waiting-room-service } }
    environment:
      <<: [*otel, *jwt]
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      ADMISSION_TOKEN_KEY: ${ADMISSION_TOKEN_KEY:?}
      WAITING_ROOM_CAPACITY: ${WAITING_ROOM_CAPACITY:-2000}
    depends_on:
      redis: { condition: service_healthy }

  # --- Observability (phase 3) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["127.0.0.1:4318:4318"]
    depends_on: [jaeger, loki]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["127.0.0.1:16686:16686"]

  loki:
    image: grafana/loki:3.7.0

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Dashboards stay viewable without logging in, but anonymous users are read-only (not Admin), and
      # the admin account needs a password. Editing or admin needs that login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticketrush-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki, jaeger]

volumes:
  postgres-data:
