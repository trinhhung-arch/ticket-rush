name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # NFR-SEC-03: every commit, gitleaks' default rules plus the test-value allowlist in .gitleaks.toml.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.0 git . --redact --no-banner -v

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      # NFR-DEP-03: the chart must lint and render; deploy/kind/up.sh installs it on a local cluster.
      - name: Lint and render
        run: |
          helm lint deploy/helm/ticketrush
          helm template ticketrush deploy/helm/ticketrush > /dev/null

  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Integration tests start Postgres, Redis, Kafka, Mailpit and Keycloak with Testcontainers.
      # booking-service and payment-service fail the build below 70 % line or branch coverage (NFR-TEST-01).
      - name: Build, test and check coverage
        run: ./mvnw -B verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '*/*/target/site/jacoco/'
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/*/target/surefire-reports/'

  images:
    name: Image ${{ matrix.module }}
    needs: [secrets, chart, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [api-gateway, event-service, booking-service, payment-service, ticket-service, notification-service, waiting-room-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # NFR-DEP-02: every pull request builds the images; only main pushes them to GHCR.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.module }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.module }}:latest
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
