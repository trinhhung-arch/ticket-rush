server:
  port: ${PORT:8082}
  # NFR-AVAIL-06: finish in-flight requests on SIGTERM, for at most 30 s.
  shutdown: graceful
  tomcat:
    # Room for a burst of new connections from the gateway. At the default of 100 the kernel
    # dropped SYNs during the payment outage drill (ListenOverflows), and gateway connects timed out.
    accept-count: 1024

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: classpath:ticketrush-observability.yml,classpath:ticketrush-security.yml,classpath:ticketrush-messaging.yml,optional:file:.env[.properties],optional:file:../../.env[.properties]
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:booking_db}
    username: ${DB_USER:booking_svc}
    password: ${DB_PASSWORD:${BOOKING_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 50
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    listener:
      # One consumer thread per partition (topics have 12, see MessagingConfig).
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:12}


ticketrush:
  kafka:
    # Kafka password when started from the IDE, read from .env (containers get KAFKA_PASSWORD).
    password: ${KAFKA_BOOKING_SERVICE_PASSWORD:}
  security:
    # The live seat map is part of browsing an event; everything else needs a customer token.
    public-paths:
      - GET /api/events/*/seats
  payment:
    # The saga verifies a PaymentSucceeded event against payment-service before confirming (NFR-SEC-01).
    base-url: ${PAYMENT_SERVICE_URI:http://localhost:8083}
  booking:
    hold-duration: PT10M
    hold-grace: PT60S
    expiry-sweep-interval-ms: 5000
    admission-token-key: ${ADMISSION_TOKEN_KEY:}
  outbox:
    relay:
      interval-ms: 200
