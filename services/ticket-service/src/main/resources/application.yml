server:
  port: ${PORT:8084}
  # NFR-AVAIL-06: finish in-flight requests on SIGTERM, for at most 30 s.
  shutdown: graceful
  tomcat:
    # Room for a burst of new connections from the gateway. At the default of 100 the kernel
    # dropped SYNs during the payment outage drill (ListenOverflows), and gateway connects timed out.
    accept-count: 1024

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: classpath:ticketrush-observability.yml,classpath:ticketrush-security.yml,optional:file:.env[.properties],optional:file:../../.env[.properties]
  application:
    name: ticket-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:ticket_db}
    username: ${DB_USER:ticket_svc}
    password: ${DB_PASSWORD:${TICKET_DB_PASSWORD:}}
    hikari:
      # Every Kafka listener thread holds a connection for its transaction, so at least the
      # listener concurrency plus room for HTTP requests.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    listener:
      # One consumer thread per partition (topics have 12, see MessagingConfig).
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:12}


ticketrush:
  ticket:
    # Required, no default: the service refuses to start without a key (NFR-SEC-03).
    signing-key: ${TICKET_SIGNING_KEY}
  outbox:
    relay:
      interval-ms: 200
